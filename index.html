<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <title>Keystone Terrain Dashboard</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- Mapbox GL JS stylesheet -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <!-- Mapbox GL JS library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

    <!-- Terrain Dashboard stylesheet -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- ==================================================
         DASHBOARD CONTROLS
         ================================================== -->

    <div id="dashboard-panel">

        <h2>Keystone Terrain Dashboard</h2>

        <div class="dashboard-row">
            <strong>Season:</strong>
            <span>24–25</span>
        </div>

        <div class="dashboard-row">
            <strong>Date:</strong>
            <span id="date-label">
                January 15, 2025
            </span>
        </div>

        <input
            id="date-slider"
            type="range"
            min="0"
            max="1"
            value="0"
            step="1"
        >

        <div class="slider-labels">
            <span id="first-date-label"></span>
            <span id="last-date-label"></span>
        </div>

    </div>


    <!-- ==================================================
         MAP LEGEND
         ================================================== -->
    
    <div id="map-legend">

        <div class="legend-title">
            Trail Status
        </div>

        <div class="legend-item">
            <span class="legend-color open"></span>
            <span>Open</span>
        </div>

        <div class="legend-item">
            <span class="legend-color groomed"></span>
            <span>Groomed</span>
        </div>

        <div class="legend-item">
            <span class="legend-color closed"></span>
            <span>Closed</span>
        </div>

        <div class="legend-item">
            <span class="legend-color racing"></span>
            <span>Racing</span>
        </div>

        <div class="legend-item">
            <span class="legend-color not-open"></span>
            <span>Not Open</span>
        </div>

        <div class="legend-item">
            <span class="legend-color no-data"></span>
            <span>No Data / Not Operational</span>
        </div>

        <div class="legend-note">
            Status reflects the historical daily terrain report
            for the selected date. Trails without a matching
            historical record are shown as
            No Data / Not Operational.
        </div>

    </div>


    <!-- ==================================================
         MAP
         ================================================== -->

    <div id="map"></div>


    <!-- ==================================================
         TERRAIN DASHBOARD JAVASCRIPT
         ================================================== -->

    <script src="js/app.js"></script>

</body>

</html>
