<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <title>Keystone Terrain Dashboard</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- Mapbox GL JS -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

    <!-- Terrain Dashboard CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div id="dashboard-panel">
        <h2>Keystone Terrain Dashboard</h2>

        <div class="dashboard-row">
            <strong>Season:</strong>
            <span>24–25</span>
        </div>

        <div class="dashboard-row">
            <strong>Date:</strong>
            <span id="date-label">January 15, 2025</span>
        </div>

        <input
            id="date-slider"
            type="range"
            min="0"
            max="1"
            value="0"
            step="1"
        >

        <div class="slider-labels">
            <span id="first-date-label"></span>
            <span id="last-date-label"></span>
        </div>
    </div>

    <div id="map"></div>

    <script src="js/app.js"></script>

</body>

</html>
