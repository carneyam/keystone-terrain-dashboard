name: Collect Keystone Daily Status

on:
  workflow_dispatch:
  
  push:
    branches:
      - live_season_automation
      - main
    paths:
      - ".github/workflows/collect_daily_status.yml"
      - "scripts/**"
      - "data/live_name_crosswalk.csv"
      - "requirements.txt"

  schedule:
    - cron: "7 9 * * *"
      timezone: "America/Denver"

permissions:
  contents: write

jobs:
  collect-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Collect Keystone daily status
        run: python3 scripts/collect_keystone.py --write

      - name: Collect Keystone daily conditions
        run: python3 scripts/collect_conditions.py --write

      - name: Commit updated daily status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/trail_status_26-27.csv
          git add data/lift_status_26-27.csv
          git add data/daily_conditions.csv

          if git diff --cached --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "Update Keystone daily status"
            git push
          fi